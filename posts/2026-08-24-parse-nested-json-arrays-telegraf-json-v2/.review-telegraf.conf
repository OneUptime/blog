[[inputs.file]]
  files = ["/Users/nawazdhandala/Projects/OneUptime/blog/posts/2026-08-24-parse-nested-json-arrays-telegraf-json-v2/.review-readings.json"]
  precision = "1ms"
  data_format = "json_v2"

  [[inputs.file.json_v2]]
    measurement_name = "device_reading"

    [[inputs.file.json_v2.object]]
      path = "batch"
      tags = ["site", "readings_device", "readings_kind"]
      included_keys = [
        "site",
        "readings_device",
        "readings_kind",
        "readings_value",
        "readings_observed_at",
      ]
      timestamp_key = "readings_observed_at"
      timestamp_format = "unix_ms"

      [inputs.file.json_v2.object.renames]
        readings_device = "device"
        readings_kind = "kind"
        readings_value = "value"

      [inputs.file.json_v2.object.fields]
        readings_value = "float"
