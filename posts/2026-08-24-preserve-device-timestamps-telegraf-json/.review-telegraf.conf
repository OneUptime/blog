[[inputs.file]]
  files = ["/work/.review-fixture.json"]
  data_format = "json_v2"
  precision = "1ns"
  time_source = "metric"

  [[inputs.file.json_v2]]
    measurement_name = "device_status"
    timestamp_path = "observed_at"
    timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"

    [[inputs.file.json_v2.tag]]
      path = "device_id"
      rename = "device"

    [[inputs.file.json_v2.field]]
      path = "temperature_c"
      type = "float"

    [[inputs.file.json_v2.field]]
      path = "battery_ok"
      type = "bool"
